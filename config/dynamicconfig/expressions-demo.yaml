# PROTOTYPE: constraint-expression dynamic config.
#
# Point at this file with:
#
#   dynamicConfigClient:
#     filepath: "config/dynamicconfig/development-cass.yaml"
#     pollInterval: "10s"
#     expressionFilepath: "config/dynamicconfig/expressions-demo.yaml"
#     expressionConstraints:
#       env: "staging"
#       zone: "us-west-2"
#       deployRing: 2
#
# Each key here is resolved by evaluating its overrides in order and taking the first
# match, falling back to defaultValue. A key present here is served entirely from this
# file; a key absent from it comes from the ordinary dynamic config file as usual; a key
# in neither uses its compiled-in default.
#
# Constraint keys available to expressions — all of them describe *where this server is*:
#
#   env, zone, cluster, service, host, serverVersion, plus any key you put in
#   expressionConstraints.
#
# Deliberately NOT available: namespace, taskQueueName, shardID and the rest. This layer
# resolves expressions once at startup, before any request exists, so it cannot see them.
# Keep using the ordinary dynamic config file for those.
#
# Operators: = != > < and or, with parentheses. Keys are quoted; values are quoted strings
# or bare numbers. A key not present in the constraints never matches.

# --- 1. Boolean logic over deployment dimensions -----------------------------
# Not expressible in the dynamic config file: it can only match a value against an exact
# Constraints struct, and has no field for env or zone at all.
matching.getTasksBatchSize:
  defaultValue: 1000
  overrides:
    - matchString: '"env" = "staging" and ("zone" = "us-west-1" or "zone" = "us-west-2")'
      matchResult: 250

# --- 2. Roll out by deployment ring ------------------------------------------
# Adding "deployRing" to the current system would mean a new field on Constraints, a new
# precedence order in cmd/tools/gendynamicconfig, and regenerating setting_gen.go. Here it
# is one YAML key that the operator invented.
system.visibilityAllowList:
  defaultValue: false
  overrides:
    - matchString: '"deployRing" > 1'
      matchResult: true

# --- 3. Target one service, or one cluster -----------------------------------
history.persistenceMaxQPS:
  defaultValue: 9000
  overrides:
    - matchString: '"service" = "history" and "zone" = "us-west-2"'
      matchResult: 18000

matching.longPollExpirationInterval:
  defaultValue: 1m
  overrides:
    - matchString: '"cluster" = "standby"'
      matchResult: 20s
