version: 1

profiles:
  testx: on

format:
  gci: on
  gofmt: on
  # gofumpt would reformat much of the code base; use gofmt for now.
  gofumpt: off

lint:
  # Its style check, which reports correct but confusing errors.As calls,
  # stays off.
  errortype:
    version: v0.0.7
  gofix:
    # embedlit rewrites large parts of the code base.
    disable: [embedlit]
  golangci-lint:
    linters:
      enable: [importas]
      # Not enabled today; turn on after the pilot.
      # onelint:override defaults
      disable: [ineffassign, unused]
      settings:
        importas:
          no-unaliased: true
          no-extra-aliases: false
          alias:
            # Service packages are not aliased. This entry must come first,
            # before the general API entry.
            - pkg: go.temporal.io(/server)?/api/(\w+)service(mock)?/v1
              alias: ""
            - pkg: go.temporal.io/api/(\w+)/v1
              alias: ${1}pb
            - pkg: go.temporal.io/server/api/(\w+)/v1
              alias: ${1}spb
        revive:
          rules:
            - name: struct-tag
              arguments:
                - "validate,persistence_custom_search_attributes"
        forbidigo:
          forbid:
            - pattern: time.Sleep
              msg: "Please use await.Require / s.Await unless there's no better option"
            - pattern: "^panic$"
              msg: "Please avoid using panic in application code"
            - pattern: time\.Now
              msg: "Using time.Now is not allowed in chasm/lib package (non-test files), use ctx.Now(component) instead"
            - pattern: "^Unix$"
              msg: "Do not use .Unix() for Cassandra timestamps (returns seconds). Use p.UnixMilliseconds() which returns milliseconds."
            - pattern: "^UnixMilli$"
              msg: "Do not use .UnixMilli() for Cassandra timestamps. Use p.UnixMilliseconds() for consistency and proper zero-time handling."
            - pattern: "^UnixNano$"
              msg: "Do not use .UnixNano() for Cassandra timestamps. Use p.UnixMilliseconds() which returns milliseconds."
            - pattern: context\.Background\(\)
              msg: "Avoid context.Background() in tests; use t.Context() to respect test timeouts and cancellation"
            # The testx profile forbids Eventually and assert; these entries
            # use the same patterns, so they replace its messages with ones that
            # name temporal's helpers.
            # onelint:override testx
            - pattern: '(^|\.)(Eventually|Eventuallyf|EventuallyWithT|EventuallyWithTf)$'
              msg: "Use await.Require / s.Await for assertion conditions, or await.RequireTrue / s.AwaitTrue for bool predicates, instead of testify Eventually helpers"
            # onelint:override testx
            - pattern: 'assert\.\w+'
              msg: "Use require.X / protorequire.X instead of assert.X / protoassert.X — assert doesn't stop the test on failure."
            - pattern: 'temporalproto\.DeepEqual'
              msg: "temporalproto.DeepEqual treats any two values of the same plain struct type as equal. Use protorequire.DeepEqual (or protodiff.Equal) instead."
            - pattern: '\bActiveInCluster\b'
              msg: "ActiveInCluster is not businessID-aware. For any decision tied to a workflow / businessID, use ns.ActiveClusterName(routingKey) instead. For genuine namespace-level checks (no workflow context), suppress with //nolint:forbidigo // <justification>."
      exclusions:
        paths:
          - ^api
          - ^proto
          - ^.git
        rules:
          - path-except: _test\.go|tests/.+\.go
            text: "time.Sleep"
            linters: [forbidigo]
          - path-except: chasm/lib/.*\.go$
            text: "time.Now"
            linters: [forbidigo]
          - path: chasm/lib/.*_test\.go$
            text: "time.Now"
            linters: [forbidigo]
          - path-except: common/persistence/cassandra/.*\.go$
            text: "Unix|UnixMilli|UnixNano"
            linters: [forbidigo]
          - path: _test\.go$
            text: "Unix|UnixMilli|UnixNano"
            linters: [forbidigo]
          - path: _test\.go|tests/.+\.go|common/testing/
            text: "panic"
            linters: [forbidigo]
          - path: chasm/lib/activity/model/.*\.go$
            text: "panic"
            linters: [forbidigo]
          - path: common/namespace/(namespace|replication_resolver)(_test)?\.go$
            text: "ActiveInCluster"
            linters: [forbidigo]
          - path-except: tests/.+_test\.go
            text: "context.Background"
            linters: [forbidigo]
          - path: tests/(nexus_standalone|nexus_workflow)_test\.go$
            text: "Eventually"
            linters: [forbidigo]
          - path: tests/(nexus_standalone|nexus_workflow)_test\.go$
            text: "assert\\.CollectT"
            linters: [forbidigo]
          - text: "use of `softassert\\.\\w+`"
            linters: [forbidigo]
          # The shared rules cover _test.go files; these cover temporal's other
          # test code.
          - path: tests/.+\.go|common/testing/
            text: "(cyclomatic|cognitive)"
            linters: [revive]
          - path: tests/.+\.go|common/testing/
            text: "(dot-imports|unchecked-type-assertion)"
            linters: [revive]
          - path: tests/.+\.go|common/testing/
            text: "ST1003: should not use underscores in Go names; (func|method) "
            linters: [staticcheck]
          - path: ^tools\/.+\.go
            linters: [revive]
          - text: "SA1019: go.temporal.io/server/service/history/hsm/(callbacks|nexusoperations) is deprecated"
            linters: [staticcheck]
          # TODO: Existing workflowcheck findings, which the old make
          # workflowcheck loop did not fail on. Fix each one, or mark it with
          # //workflowcheck:ignore if it is a false positive, and remove its
          # rule. A new finding, even in the same workflow, still fails.
          - path: ^service/worker/deletenamespace/deleteexecutions/workflow\.go$
            text: 'deleteexecutions\.DeleteExecutionsWorkflow is non-deterministic, reason: calls non-deterministic function \(\*go\.temporal\.io/server/service/worker/deletenamespace/deleteexecutions\.DeleteExecutionsConfig\)\.String( |$)'
            linters: [workflowcheck]
          - path: ^service/worker/scheduler/export_test\.go$
            text: 'scheduler\.GenerateScheduledActionsForTest is non-deterministic, reason: calls non-deterministic function go\.temporal\.io/server/service/worker/scheduler\.NewSpecBuilder( |$)'
            linters: [workflowcheck]
          - path: ^service/worker/scheduler/workflow\.go$
            text: 'scheduler\.SchedulerWorkflow is non-deterministic, reason: calls non-deterministic function \(go\.temporal\.io/server/common/dynamicconfig\.GlobalTypedSetting\[T\]\)\.Get( |$)'
            linters: [workflowcheck]
          - path: ^service/worker/scheduler/workflow\.go$
            text: 'scheduler\.SchedulerWorkflow is non-deterministic, reason: calls non-deterministic function go\.temporal\.io/server/service/worker/scheduler\.NewSpecBuilder( |$)'
            linters: [workflowcheck]
          - path: ^service/worker/scheduler/workflow\.go$
            text: 'scheduler\.SchedulerWorkflow is non-deterministic, reason: calls non-deterministic function go\.temporal\.io/server/service/worker/scheduler\.schedulerWorkflowWithSpecBuilder( |$)'
            linters: [workflowcheck]
          - path: ^service/worker/scheduler/workflow\.go$
            text: 'scheduler\.schedulerWorkflowWithSpecBuilder is non-deterministic, reason: calls non-deterministic function \(\*go\.temporal\.io/server/service/worker/scheduler\.scheduler\)\.run( |$)'
            linters: [workflowcheck]
          # NilAway reports only in its scope; make lint-nilaway checks it in
          # full.
          - path-except: ^chasm/lib/scheduler/
            linters: [nilaway]
          # workflowcheck checks the system workflows; make workflowcheck
          # checks them in full.
          - path-except: ^service/worker/
            linters: [workflowcheck]
  govet: on
  # Nil-safety analysis. Widen include-pkgs, and the matching exclusion above,
  # as more packages are made nil-clean; without include-pkgs, NilAway
  # analyzes every dependency and runs out of memory in CI.
  nilaway:
    include-pkgs: go.temporal.io/server/chasm/lib/scheduler
    exclude-test-files: true
    exclude-file-docstrings: Code generated by
    version: v0.0.0-20260717164209-b48ebb193579
  workflowcheck:
    version: v0.6.0
