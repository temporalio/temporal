syntax = "proto3";

package temporal.server.chasm.lib.wci.proto.v1;

import "chasm/lib/wci/proto/v1/message.proto";
import "google/protobuf/timestamp.proto";
import "temporal/api/enums/v1/task_queue.proto";

option go_package = "go.temporal.io/server/chasm/lib/wci/gen/wcipb;wcipb";

// Each task snapshots the state field that makes it stale; Validate compares it.

// Side-effect timer. Fires at next_poll_time: DescribeWorkerDeploymentVersion, then ProcessMetricsPoll, which re-arms it.
// Stale unless poll_time is next_poll_time, at validation and at write-back.
message MetricsPollTimerTask {
  google.protobuf.Timestamp poll_time = 1;
}

// Pure. Fires at pending_expire_time; aborts a migration that was never activated.
message PendingExpiryTask {
  google.protobuf.Timestamp expire_time = 1;
}

// Side-effect. Fetches a snapshot, then ProcessDeferredScalingDecision.
message DeferredDecisionTask {
  string scaling_group_id = 1;
  TaskAddEvent task_add = 2;
  // The group's task types in the host region when the decision was deferred.
  repeated temporal.api.enums.v1.TaskQueueType effective_task_types = 3;
}

// Side-effect timer. Fires at next_validation_time: validates the whole spec, then re-arms.
// Stale unless validation_time is next_validation_time, at validation and at write-back.
message ValidateSpecTask {
  google.protobuf.Timestamp validation_time = 1;
}

// Side-effect. Signals the version workflow with the newest validation status.
message SignalVersionWorkflowTask {
  google.protobuf.Timestamp last_validation_time = 1;
}

// Side-effect. Starts the workflow from converted state.
message MigrateToWorkflowTask {}

// Side-effect, on a MIGRATED instance. Sends the workflow the task-adds queued after its activation.
message ForwardTaskAddsTask {}

// Pure. BACKING_OFF -> SCALING.
message ScalingGroupBackoffTask {
  int32 attempt = 1;
}

// Side-effect. UpdateWorkerSetSize(desired_size).
message ResizeTask {
  int32 attempt = 1;
}

// Side-effect. InvokeWorker.
message InvokeTask {
  // transition_count of the scheduling transaction; idempotency key.
  int64 request_id = 1;
  int32 attempt = 2;
}
