syntax = "proto3";

package temporal.server.chasm.lib.taskqueue.proto.v1;

import "temporal/server/api/clock/v1/message.proto";

option go_package = "go.temporal.io/server/chasm/lib/taskqueue/gen/taskqueuepb;taskqueuepb";

message TaskQueueState {
  // Set by termination; closes the task queue execution and prevents further updates.
  bool closed = 1;
}

message UserDataState {
  // CHASM CAS version, independent of the DB version; starts at 1 and increments on successful updates.
  int64 version = 1;
  // Incoming user data HLC, preserved without modification; not used for CHASM CAS.
  temporal.server.api.clock.v1.HybridLogicalClock clock = 3;
}
