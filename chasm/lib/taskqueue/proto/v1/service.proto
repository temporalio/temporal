syntax = "proto3";

package temporal.server.chasm.lib.taskqueue.proto.v1;

import "chasm/lib/taskqueue/proto/v1/request_response.proto";
import "temporal/server/api/common/v1/api_category.proto";
import "temporal/server/api/routing/v1/extension.proto";

option go_package = "go.temporal.io/server/chasm/lib/taskqueue/gen/taskqueuepb;taskqueuepb";

service TaskQueueUserDataService {
  rpc GetTaskQueueUserData(GetTaskQueueUserDataRequest) returns (GetTaskQueueUserDataResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "task_queue";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }
  rpc UpsertTaskQueueUserData(UpsertTaskQueueUserDataRequest) returns (UpsertTaskQueueUserDataResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "task_queue";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }
}
