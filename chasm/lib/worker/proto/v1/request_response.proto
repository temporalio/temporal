syntax = "proto3";

package temporal.server.chasm.lib.worker.proto.v1;

import "temporal/api/workflowservice/v1/request_response.proto";

option go_package = "go.temporal.io/server/chasm/lib/worker/gen/workerpb;workerpb";

// RecordHeartbeatRequest records heartbeats for one worker group.
message RecordHeartbeatRequest {
  // Internal namespace ID (UUID).
  string namespace_id = 1;

  // Grouping key shared by the workers in this request.
  string worker_grouping_key = 3;

  // The public heartbeat request, forwarded by Frontend for this group.
  // All worker heartbeats must have the specified worker_grouping_key.
  temporal.api.workflowservice.v1.RecordWorkerHeartbeatRequest frontend_request = 2;
}

// A successful RecordHeartbeatResponse acknowledges a persisted heartbeat update.
message RecordHeartbeatResponse {
  // The public heartbeat response to return through Frontend.
  temporal.api.workflowservice.v1.RecordWorkerHeartbeatResponse frontend_response = 1;
}
