syntax = "proto3";

package temporal.server.chasm.lib.callback.proto.v1;

option go_package = "go.temporal.io/server/chasm/lib/callback/gen/callbackpb/v1;callbackpb";

message InvocationTask {
  // The attempt number for this invocation.
  int32 attempt = 1;
}

message BackoffTask {
  // The attempt number for this invocation.
  int32 attempt = 1;
}
