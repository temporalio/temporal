syntax = "proto3";

package temporal.server.chasm.lib.namespacereplication.proto.v1;

import "google/protobuf/timestamp.proto";
import "temporal/api/failure/v1/message.proto";
import "temporal/server/api/enums/v1/replication.proto";
import "temporal/server/api/persistence/v1/namespaces.proto";

option go_package = "go.temporal.io/server/chasm/lib/namespacereplication/gen/namespacereplicationpb;namespacereplicationpb";

// NamespaceMutation is the input to a NamespaceMutationComponent. It contains
// the full target state of the namespace and the local CAS guard.
message NamespaceMutation {
  // CREATE or UPDATE.
  temporal.server.api.enums.v1.NamespaceOperation operation = 1;

  // Full target NamespaceDetail. The local apply writes this detail to the
  // metadata store. Peer applies convert it to NamespaceTaskAttributes before
  // invoking ApplyNamespaceMutation.
  temporal.server.api.persistence.v1.NamespaceDetail namespace_detail = 2;

  // CAS guard for the local apply. Must match the metadata store's current
  // notification_version (today: cell-global counter; future: per-namespace).
  int64 expected_version = 3;

  // List of peer cells to fan out to after the local apply succeeds. For an
  // update, this is the union of the previous and target cluster lists, minus
  // the local cell, so a removed peer receives the final configuration.
  repeated string peer_cells = 4;

  // Whether the target namespace state is global. The CHASM namespace
  // replication component rejects local namespace mutations.
  bool is_global_namespace = 5;
}

// NamespaceMutationState is the persisted state of a NamespaceMutationComponent.
message NamespaceMutationState {
  // The mutation being applied.
  NamespaceMutation mutation = 1;

  // Top-level lifecycle status. Drives LifecycleState().
  ComponentStatus status = 2;

  // Local apply status, including durable retry progress and the terminal outcome.
  LocalApplyStatus local_apply = 3;

  // Per-peer apply outcomes, keyed by target cell name.
  map<string, PeerApplyStatus> peer_apply = 4;
}

enum ComponentStatus {
  COMPONENT_STATUS_UNSPECIFIED = 0;
  // Component is running: local apply pending or in progress, or peer fan-out in progress.
  COMPONENT_STATUS_RUNNING = 1;
  // All tasks reached a terminal state (success or final failure). Component is done.
  COMPONENT_STATUS_COMPLETED = 2;
  // Local apply failed or remained indeterminate. Peer fan-out was never attempted.
  COMPONENT_STATUS_FAILED = 3;
}

// LocalApplyOutcome reports the result of the local CAS write. INDETERMINATE is
// terminal, but kept distinct from FAILED because the write may have committed.
enum LocalApplyOutcome {
  LOCAL_APPLY_OUTCOME_UNSPECIFIED = 0;
  LOCAL_APPLY_OUTCOME_PENDING = 1;
  LOCAL_APPLY_OUTCOME_COMMITTED = 2;
  LOCAL_APPLY_OUTCOME_FAILED = 3;
  LOCAL_APPLY_OUTCOME_INDETERMINATE = 4;
}

// PeerApplyOutcome reports the result of a peer apply via the
// ApplyNamespaceMutation admin RPC. Richer than the local outcome because the
// receiver's apply-if-higher logic can no-op stale incoming mutations, and the
// RPC can fail in retriable or terminal ways.
enum PeerApplyOutcome {
  PEER_APPLY_OUTCOME_UNSPECIFIED = 0;
  PEER_APPLY_OUTCOME_PENDING = 1;
  PEER_APPLY_OUTCOME_APPLIED = 2;
  PEER_APPLY_OUTCOME_NO_OP_STALE = 3;
  PEER_APPLY_OUTCOME_FAILED_RETRIABLE = 4;
  PEER_APPLY_OUTCOME_FAILED_TERMINAL = 5;
  // The peer's admission policy declined the namespace (receiver returned
  // OUTCOME_NOT_ADMITTED). Terminal and not a failure — the peer deliberately
  // chose not to hold this namespace, so there is nothing to retry. Kept
  // distinct from APPLIED so the sender never records a phantom write, and from
  // FAILED_* so it doesn't read as an error.
  PEER_APPLY_OUTCOME_NOT_ADMITTED = 6;
}

message LocalApplyStatus {
  // Current outcome of the local metadata-store apply.
  LocalApplyOutcome outcome = 1;
  // Time the local apply reached a terminal outcome. Unset while pending.
  google.protobuf.Timestamp resolved_at = 2;
  // Failure detail when outcome is FAILED or INDETERMINATE.
  temporal.api.failure.v1.Failure failure = 3;
  // Number of unresolved attempts recorded. This is also the attempt expected
  // on the next ApplyLocalTask while the outcome remains PENDING.
  int32 attempt_count = 4;
  // Time the first unresolved attempt was recorded. This starts the retry budget.
  google.protobuf.Timestamp first_attempt_at = 5;
  // Time the most recent unresolved attempt was recorded.
  google.protobuf.Timestamp last_attempt_at = 6;
  // Most recent unresolved failure, retained for diagnostics.
  temporal.api.failure.v1.Failure last_failure = 7;
}

message PeerApplyStatus {
  // Current outcome of applying the mutation to this peer.
  PeerApplyOutcome outcome = 1;
  // Number of completed apply attempts.
  int32 attempt_count = 2;
  // Time the first apply attempt result was recorded. Unset before the first attempt.
  google.protobuf.Timestamp first_attempt_at = 3;
  // Time the most recent apply attempt result was recorded.
  google.protobuf.Timestamp last_attempt_at = 4;
  // Most recent failure. Retained after a later successful attempt for diagnostics.
  temporal.api.failure.v1.Failure last_failure = 5;
}
