syntax = "proto3";

package temporal.server.chasm.lib.namespacereplication.proto.v1;

option go_package = "go.temporal.io/server/chasm/lib/namespacereplication/gen/namespacereplicationpb;namespacereplicationpb";

// ApplyLocalTask applies or reconciles the local mutation and gates peer fan-out.
// Validate rejects stale or duplicate retries using attempt.
message ApplyLocalTask {
  // The current retry generation. It must match LocalApplyStatus.attempt_count.
  int32 attempt = 1;
}

// ApplyPeerTask is dispatched once per peer cell after ApplyLocalTask completes.
// One task instance per peer; Validate uses TargetCell to match the right
// peer_apply status entry on the component.
message ApplyPeerTask {
  // Which peer cell this task targets. Must match a key in NamespaceMutationState.peer_apply.
  string target_cell = 1;
  // The current attempt number for this peer. Used by Validate to gate stale retries.
  int32 attempt = 2;
}

// ApplyPeerBackoffTask fires after a retriable peer apply failure. It is a pure
// timer task that re-enqueues ApplyPeerTask as an immediate outbound task.
message ApplyPeerBackoffTask {
  // Peer cell whose retry is released when this timer fires.
  string target_cell = 1;
  // Attempt number used to reject stale or duplicate retry timers.
  int32 attempt = 2;
}
