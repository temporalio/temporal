syntax = "proto3";

package temporal.server.chasm.lib.tquserdata.proto.v1;

import "temporal/server/api/clock/v1/message.proto";
import "temporal/server/api/persistence/v1/task_queues.proto";

option go_package = "go.temporal.io/server/chasm/lib/tquserdata/gen/tquserdatapb;tquserdatapb";

message UpsertTaskQueueUserDataRequest {
  // Namespace containing the task queue family.
  string namespace_id = 1;
  // Task queue family name, used internally as the CHASM business ID.
  string task_queue = 2;
  // Per-type updates keyed by temporal.api.enums.v1.TaskQueueType; the map must not be empty.
  // Each non-empty payload replaces that type's data. Nil, empty, and omitted types are ignored.
  map<int32, temporal.server.api.persistence.v1.TaskQueueTypeUserData> per_type = 3;
  // Expected CHASM CAS version, independent of the DB version.
  // Zero starts a new execution if none is running; positive values require an exact version match.
  // Negative values are invalid.
  int64 expected_version = 4;
  // Incoming user data HLC, preserved unchanged and persisted in component state.
  temporal.server.api.clock.v1.HybridLogicalClock clock = 5;
}

message UpsertTaskQueueUserDataResponse {
  // CHASM CAS version after the write; starts at 1 and increments on each successful update.
  int64 version = 1;
}

// TODO: Accept a task queue type and return user data for that type only.
message GetTaskQueueUserDataRequest {
  // Namespace containing the task queue family.
  string namespace_id = 1;
  // Task queue family name, used internally as the CHASM business ID.
  string task_queue = 2;
}

message GetTaskQueueUserDataResponse {
  // Per-type payloads keyed by temporal.api.enums.v1.TaskQueueType.
  map<int32, temporal.server.api.persistence.v1.TaskQueueTypeUserData> per_type = 1;
  // CHASM CAS version of the returned user data, independent of the DB version.
  int64 version = 2;
  // Incoming user data HLC, preserved unchanged.
  temporal.server.api.clock.v1.HybridLogicalClock clock = 3;
}
