syntax = "proto3";

package temporal.server.chasm.lib.tquserdata.proto.v1;

import "temporal/server/api/clock/v1/message.proto";
import "temporal/server/api/persistence/v1/task_queues.proto";

option go_package = "go.temporal.io/server/chasm/lib/tquserdata/gen/tquserdatapb;tquserdatapb";

message TaskQueueUserData {
  // Per-type payloads keyed by temporal.api.enums.v1.TaskQueueType.
  map<int32, temporal.server.api.persistence.v1.TaskQueueTypeUserData> per_type = 1;
  // Incoming user data HLC, preserved unchanged and persisted in component state.
  temporal.server.api.clock.v1.HybridLogicalClock clock = 2;
}
