syntax = "proto3";

package temporal.server.chasm.lib.workflow.proto.v1;

import "temporal/api/enums/v1/event_type.proto";
import "temporal/api/failure/v1/message.proto";

option go_package = "go.temporal.io/server/chasm/lib/workflow/gen/workflowpb;workflowpb";

message UpdateState {
  string update_id = 1;
  // Populated when the update was rejected by a validator.
  // Used to resolve the update outcome for callbacks on rejected updates.
  temporal.api.failure.v1.Failure rejection_failure = 2;
  // History event references for attached callbacks, keyed by request ID.
  map<string, CallbackAttachmentEventReference> callback_attachment_event_references = 3;
}

message CallbackAttachmentEventReference {
  // The type of history event that attached the callbacks.
  temporal.api.enums.v1.EventType event_type = 1;
  // The ID of the history event that attached the callbacks.
  int64 event_id = 2;
}
