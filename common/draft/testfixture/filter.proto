syntax = "proto3";

package temporal.api.drafttest.v1;

import "google/protobuf/any.proto";
import "temporal/api/protometa/v1/draft.proto";

option go_package = "go.temporal.io/server/common/draft/testfixture;testfixture";

message Message {
  string stable = 1;
  string feature_a = 2 [(temporal.api.protometa.v1.draft) = "feature-a"];
  string feature_b = 3 [(temporal.api.protometa.v1.draft) = "feature-b"];
  Message child = 4 [(temporal.api.protometa.v1.draft) = "feature-a"];
  repeated Message items = 5;
  map<string, Message> by_name = 6;
  optional int32 optional_a = 7 [(temporal.api.protometa.v1.draft) = "feature-a"];
  oneof choice {
    string choice_a = 8 [(temporal.api.protometa.v1.draft) = "feature-a"];
    Message choice_child = 9;
  }
  bytes raw = 10;
  google.protobuf.Any opaque = 11;
}

message StableMessage { string stable = 1; }

message Parent { Message message = 1; }
message MapParent { map<string, Parent> values = 1; }

message WholeDraft {
  option (temporal.api.protometa.v1.draft_message) = "feature-a";
  string value = 1;
  enum State { ZERO = 0; ONE = 1; }
  message Nested {
    string value = 1;
  }
  // Plain inherits the feature of its lexical parent.
  message Plain { string value = 1; }
}
message EmptyDraft {
  option (temporal.api.protometa.v1.draft_message) = "feature-a";
}
message DraftReferences {
  string stable = 1;
  WholeDraft child = 2 [(temporal.api.protometa.v1.draft) = "feature-a"];
  repeated WholeDraft items = 3 [(temporal.api.protometa.v1.draft) = "feature-a"];
  map<string, WholeDraft> values = 4 [(temporal.api.protometa.v1.draft) = "feature-a"];
  WholeDraft.State state = 5 [(temporal.api.protometa.v1.draft) = "feature-a"];
  WholeDraft.Nested nested = 6 [(temporal.api.protometa.v1.draft) = "feature-a"];
  WholeDraft also_draft = 7 [(temporal.api.protometa.v1.draft) = "feature-a"];
  oneof choice {
    WholeDraft draft_child = 8 [(temporal.api.protometa.v1.draft) = "feature-a"];
    string stable_choice = 9;
  }
}
// The only reference to a draft nested enum.
message EnumOnlyRef { WholeDraft.State state = 1 [(temporal.api.protometa.v1.draft) = "feature-a"]; }
// The only reference to an unannotated message nested in a draft message.
message LexicalRef { WholeDraft.Plain p = 1 [(temporal.api.protometa.v1.draft) = "feature-a"]; }

enum StableEnum {
  STABLE_ENUM_UNSPECIFIED = 0;
  STABLE_ENUM_STABLE = 1;
  STABLE_ENUM_PREVIEW = 2 [(temporal.api.protometa.v1.draft_enum_value) = "enum-value"];
}

enum DraftEnum {
  option (temporal.api.protometa.v1.draft_enum) = "feature-a";
  DRAFT_ENUM_UNSPECIFIED = 0;
  DRAFT_ENUM_PREVIEW = 1;
}

message EnumRequest {
  message Reference {}
  StableEnum value = 1;
  repeated StableEnum values = 2;
  map<string, StableEnum> by_name = 3;
  optional StableEnum optional_value = 4;
  oneof stable_choice {
    string text = 5;
    StableEnum option = 6;
    string reference = 10 [(temporal.api.protometa.v1.draft) = "feature-a"];
  }
  oneof preview_choice {
    option (temporal.api.protometa.v1.draft_oneof) = "feature-a";
    StableEnum preview = 7;
  }
  DraftEnum draft_enum = 8 [(temporal.api.protometa.v1.draft) = "feature-a"];
  StableEnum draft_field = 9 [(temporal.api.protometa.v1.draft) = "feature-b"];
}

message EnumResponse { EnumValues values = 1; }

message EnumValues {
  StableEnum value = 1;
  repeated StableEnum values = 2;
  map<string, StableEnum> by_name = 3;
}

message MethodRequest {
  option (temporal.api.protometa.v1.draft_message) = "method";
  string namespace = 1;
  string namespace_id = 2;
  EnumValues values = 3;
}
message MethodResponse {
  option (temporal.api.protometa.v1.draft_message) = "method";
  EnumValues values = 1;
}
message ServiceRequest {
  option (temporal.api.protometa.v1.draft_message) = "service";
  string namespace = 1;
}
message ServiceResponse {
  option (temporal.api.protometa.v1.draft_message) = "service";
}

service FixtureService {
  rpc CheckEnums(EnumRequest) returns (EnumResponse);
  rpc Preview(MethodRequest) returns (MethodResponse) {
    option (temporal.api.protometa.v1.draft_method) = "method";
  }
}
service DraftFixtureService {
  option (temporal.api.protometa.v1.draft_service) = "service";
  rpc Preview(ServiceRequest) returns (ServiceResponse);
}

// OneofGetterCollision exercises a generated getter that conflicts with Descriptor.
message OneofGetterCollision {
  oneof descriptor {
    option (temporal.api.protometa.v1.draft_oneof) = "feature-a";
    string label = 1;
  }
}
