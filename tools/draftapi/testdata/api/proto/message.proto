syntax = "proto3";

package temporal.api.testdraft.v1;

option go_package = "go.temporal.io/api/testdraft/v1;testdraft";

import "draft.proto";

message Stable {
  string stable = 1;
  string draft = 2 [(temporal.api.protometa.v1.draft) = "field-feature"];
  map<string, string> draft_map = 3 [(temporal.api.protometa.v1.draft) = "map-feature"];
  oneof choice {
    string stable_choice = 4;
    string draft_choice = 5 [(temporal.api.protometa.v1.draft) = "branch-feature"];
  }
  oneof draft_union {
    option (temporal.api.protometa.v1.draft_oneof) = "oneof-feature";
    string member = 6;
  }
  Draft whole = 7 [(temporal.api.protometa.v1.draft) = "message-feature"];
  Draft also_draft = 8 [(temporal.api.protometa.v1.draft) = "message-feature"];
  repeated Draft list = 9 [(temporal.api.protometa.v1.draft) = "message-feature"];
  map<string, Draft.Nested> by_name = 10 [(temporal.api.protometa.v1.draft) = "message-feature"];
  Draft.NestedEnum inherited_enum = 11 [(temporal.api.protometa.v1.draft) = "message-feature"];
  oneof mixed {
    Draft draft_child = 12 [(temporal.api.protometa.v1.draft) = "message-feature"];
    string ordinary = 13;
  }
  Draft.SecondNested nested_draft = 14 [(temporal.api.protometa.v1.draft) = "message-feature"];
  // Feature names are any whitespace-free token, as in the generators.
  string slashed = 15 [(temporal.api.protometa.v1.draft) = "qa//experimental"];
  message StableNested { string stable = 1; }
  message DraftNested {
    option (temporal.api.protometa.v1.draft_message) = "nested-feature";
    string value = 1;
  }
}

message Draft {
  option (temporal.api.protometa.v1.draft_message) = "message-feature";
  string value = 1;
  message Nested { string value = 1; }
  enum NestedEnum { ZERO = 0; }
  message SecondNested { string value = 1; }
}

enum StableEnum {
  STABLE_ZERO = 0;
  DRAFT_VALUE = 1 [(temporal.api.protometa.v1.draft_enum_value) = "value-feature"];
  STABLE_OTHER = 2;
}

enum DraftEnum {
  option (temporal.api.protometa.v1.draft_enum) = "enum-feature";
  DRAFT_ZERO = 0;
}

message RegisterEmptyDraftServiceHandler {}
message StableService_DraftCallClient {}
message StableService_DraftCallServer {}
message StableRequest {}
message StableResponse {}
message MethodRequest { option (temporal.api.protometa.v1.draft_message) = "method-feature"; }
message MethodResponse { option (temporal.api.protometa.v1.draft_message) = "method-feature"; }
message StreamRequest { option (temporal.api.protometa.v1.draft_message) = "stream-feature"; }
message StreamResponse { option (temporal.api.protometa.v1.draft_message) = "stream-feature"; }
message ServiceRequest { option (temporal.api.protometa.v1.draft_message) = "service-feature"; }
message ServiceResponse { option (temporal.api.protometa.v1.draft_message) = "service-feature"; }

service StableService {
  rpc StableCall(StableRequest) returns (StableResponse);
  rpc Stream(StreamRequest) returns (stream StreamResponse) {
    option (temporal.api.protometa.v1.draft_method) = "stream-feature";
  }
  rpc DraftCall(MethodRequest) returns (MethodResponse) {
    option (temporal.api.protometa.v1.draft_method) = "method-feature";
  }
}

service DraftService {
  option (temporal.api.protometa.v1.draft_service) = "service-feature";
  rpc Call(ServiceRequest) returns (ServiceResponse);
}

service EmptyDraftService {
  option (temporal.api.protometa.v1.draft_service) = "empty-service-feature";
}
