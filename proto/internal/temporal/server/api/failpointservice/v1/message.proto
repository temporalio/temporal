syntax = "proto3";

package temporal.server.api.failpointservice.v1;

import "temporal/server/api/enums/v1/failpoint.proto";

option go_package = "go.temporal.io/server/api/failpointservice/v1;failpointservice";

// FailpointInfo describes the state of a failpoint.
message FailpointInfo {
  reserved 1;
  // key is the failpoint name.
  string key = 5;
  // namespace_id is the namespace the failpoint is scoped to. Empty means all namespaces.
  string namespace_id = 6;
  // enabled indicates whether the failpoint is active.
  bool enabled = 2;
  // action describes what the failpoint does.
  temporal.server.api.enums.v1.FailpointAction action = 3;
  // recurrence indicates whether it triggers once or always.
  temporal.server.api.enums.v1.FailpointRecurrence recurrence = 4;
}
