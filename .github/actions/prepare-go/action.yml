name: Prepare Go
description: Set up Go with mise, cache Go outputs, and optionally download modules with retry.

inputs:
  download-modules:
    description: Download all module dependencies before running Go commands.
    default: "true"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        install_args: go
        cache_save_post: true
        minimum_release_age: 14d
        auto_update: true

    - name: Resolve Go cache paths
      id: go-env
      shell: bash
      run: |
        echo "go-version=$(go env GOVERSION | sed 's/^go//')" >> "$GITHUB_OUTPUT"
        echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    - name: Restore dependencies
      id: restore-deps
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.go-env.outputs.gomodcache }}
        key: go-${{ runner.os }}${{ runner.arch }}-${{ steps.go-env.outputs.go-version }}-${{ hashFiles('go.mod') }}-deps-${{ hashFiles('go.sum') }}

    - name: Restore Go tools
      id: restore-tools
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: .bin
        key: go-${{ runner.os }}${{ runner.arch }}-${{ steps.go-env.outputs.go-version }}-tools-${{ hashFiles('Makefile') }}

    # Cache restore can miss modules after go.sum changes or partial cache saves.
    # Retrying download here isolates transient Go proxy failures from the Go command.
    - name: Download Go modules
      if: inputs.download-modules == 'true'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        max_attempts: 3
        retry_wait_seconds: 10
        timeout_minutes: 5
        shell: bash
        command: go mod download

    - name: Restore build outputs
      id: restore-build
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.go-env.outputs.gocache }}
        key: go-${{ runner.os }}${{ runner.arch }}-${{ steps.go-env.outputs.go-version }}-build-${{ env.COMMIT || github.sha }}
        restore-keys: |
          go-${{ runner.os }}${{ runner.arch }}-${{ steps.go-env.outputs.go-version }}-build-
