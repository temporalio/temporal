name: testx bump

# The server's go.mod replaces go.temporal.io/testx with ./testx, but consumers of the server
# ignore that replace and get the required testx version instead. This workflow keeps that version
# pointed at the latest commit that changed testx/.

on:
  push:
    branches:
      - main
    paths:
      - "testx/**"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: testx-bump
  cancel-in-progress: false

env:
  BRANCH: auto/testx-bump

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.TEMPORAL_CICD_APP_ID }}
          private-key: ${{ secrets.TEMPORAL_CICD_PRIVATE_KEY }}
          owner: temporalio

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Require latest testx commit
        id: bump
        run: |
          sha=$(git rev-list -1 HEAD -- testx/)
          go get "go.temporal.io/testx@${sha}"
          go mod tidy
          echo "sha=${sha::9}" >> "${GITHUB_OUTPUT}"

      - name: Create pull request
        id: create-pr
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "testx version is already current"
            exit 0
          fi

          # Delete remote branch if it exists from a previous run.
          # This will also close a previous, stuck PR if it exists.
          git push origin --delete ${{ env.BRANCH }} 2>/dev/null || true

          git config --local user.name 'Temporal Data'
          git config --local user.email 'commander-data@temporal.io'

          git checkout -b ${{ env.BRANCH }}
          git add go.mod go.sum
          git commit -m "Bump go.temporal.io/testx to ${{ steps.bump.outputs.sha }}"
          git push origin ${{ env.BRANCH }}

          pr_url=$(gh pr create \
            --title "Bump go.temporal.io/testx to ${{ steps.bump.outputs.sha }}" \
            --body "Automatically generated by the testx-bump workflow.")

          echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Approve pull request
        if: steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
        run: gh pr review --approve "${PR_URL}"

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
        run: gh pr merge "${PR_URL}" --auto --squash
