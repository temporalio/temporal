name: testx bump

# The server's go.mod replaces go.temporal.io/testx with ./common/testx, but consumers of the server
# ignore that replace and get the required testx version instead. This workflow keeps that version
# pointed at the latest commit that changed common/testx/.

on:
  push:
    branches:
      - main
    paths:
      - "common/testx/**"
      - "go.mod"
  schedule:
    # Runs at 0800 UTC (night in the US) daily, to retry a failed or stuck bump and check the pin.
    - cron: "0 8 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: testx-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: Iv23lixhka3SIlRq24Sd
          private-key: ${{ secrets.VERSION_BUMPER_PRIVATE_KEY }}
          owner: temporalio

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Update testx on main
        run: |
          sha=$(git rev-list -1 HEAD -- common/testx/)
          go get "go.temporal.io/testx@${sha}"
          go mod tidy

          if git diff --quiet -- go.mod go.sum; then
            echo "testx version is already current"
            exit 0
          fi

          git config --local user.name 'Temporal Data'
          git config --local user.email 'commander-data@temporal.io'

          git add go.mod go.sum
          git commit -m "Bump go.temporal.io/testx to ${sha::9}"
          git push origin HEAD:main

  # Fails if the testx version required on main doesn't match common/testx/, e.g. because the bump failed
  # to push. Builds in this repo don't notice, since they use the replace.
  # Runs nightly (US time), when the bump for the day's testx changes should have landed.
  check-pin:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check required testx version is current
        run: |
          version=$(go list -m -f '{{.Version}}' go.temporal.io/testx)
          pinned=${version##*-}
          if ! git diff --quiet "${pinned}" HEAD -- common/testx/; then
            echo "::error file=go.mod::Required testx version doesn't match common/testx/."
            exit 1
          fi

  notify-failure:
    name: Notify Slack on Failure
    if: ${{ false }}
    needs: [bump, check-pin]
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          BUMP_RESULT: ${{ needs.bump.result }}
          CHECK_PIN_RESULT: ${{ needs.check-pin.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text=$(printf '%s\n' \
            ":warning: *go.temporal.io/testx version on main needs attention*" \
            "bump: ${BUMP_RESULT}" \
            "check-pin: ${CHECK_PIN_RESULT}" \
            "<${RUN_URL}|View run>")
          jq -n --arg text "${text}" '{text: $text}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- "${SLACK_WEBHOOK}"
