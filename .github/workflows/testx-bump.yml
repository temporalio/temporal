name: testx bump

# The server's go.mod replaces go.temporal.io/testx with ./testx, but consumers of the server
# ignore that replace and get the required testx version instead. This workflow keeps that version
# pointed at the latest commit that changed testx/.

on:
  push:
    branches:
      - main
    paths:
      - "testx/**"
  schedule:
    # Runs at 0800 UTC daily, to retry a failed or stuck bump.
    - cron: "0 8 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

concurrency:
  group: testx-bump
  cancel-in-progress: false

env:
  BRANCH: auto/testx-bump

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Generate GitHub token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.TEMPORAL_CICD_APP_ID }}
          private-key: ${{ secrets.TEMPORAL_CICD_PRIVATE_KEY }}
          owner: temporalio

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Require latest testx commit
        id: bump
        run: |
          sha=$(git rev-list -1 HEAD -- testx/)
          go get "go.temporal.io/testx@${sha}"
          go mod tidy
          echo "sha=${sha::9}" >> "${GITHUB_OUTPUT}"

      - name: Create pull request
        id: create-pr
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "testx version is already current"
            exit 0
          fi

          title="Bump go.temporal.io/testx to ${{ steps.bump.outputs.sha }}"
          if gh pr list --head ${{ env.BRANCH }} --author app/temporal-cicd --state open --json title -q '.[].title' | grep -qxF "${title}"; then
            echo "An open PR already bumps to this commit"
            exit 0
          fi

          # Delete remote branch if it exists from a previous run.
          # This will also close a previous PR that bumps to an older commit.
          git push origin --delete ${{ env.BRANCH }} 2>/dev/null || true

          git config --local user.name 'Temporal Data'
          git config --local user.email 'commander-data@temporal.io'

          git checkout -b ${{ env.BRANCH }}
          git add go.mod go.sum
          git commit -m "${title}"
          git push origin ${{ env.BRANCH }}

          pr_url=$(gh pr create \
            --title "${title}" \
            --body "Automatically generated by the testx-bump workflow.")

          echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Approve pull request
        if: steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
        run: gh pr review --approve "${PR_URL}"

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
        run: gh pr merge "${PR_URL}" --auto --squash

  # Fails if the testx version required on main has been behind testx/ for more than a day, e.g.
  # because the bump failed or its PR got stuck. Builds in this repo don't notice, since they use
  # the replace.
  check-pin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check required testx version is current
        run: |
          version=$(go list -m -f '{{.Version}}' go.temporal.io/testx)
          pinned=${version##*-}
          if git rev-parse -q --verify "${pinned}^{commit}" >/dev/null && git diff --quiet "${pinned}" HEAD -- testx/; then
            exit 0
          fi

          # The oldest testx change missing from the required version.
          range=HEAD
          if git rev-parse -q --verify "${pinned}^{commit}" >/dev/null; then
            range="${pinned}..HEAD"
          fi
          oldest=$(git log --format=%ct "${range}" -- testx/ | tail -1)
          age=$(( $(date +%s) - oldest ))
          if [ "${age}" -gt 86400 ]; then
            echo "::error file=go.mod::Required testx version doesn't match testx/."
            exit 1
          fi

  notify-failure:
    name: Notify Slack on Failure
    if: failure()
    needs: [bump, check-pin]
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          BUMP_RESULT: ${{ needs.bump.result }}
          CHECK_PIN_RESULT: ${{ needs.check-pin.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUMP_PRS_URL: ${{ github.server_url }}/${{ github.repository }}/pulls?q=head%3A${{ env.BRANCH }}
        run: |
          details=()
          if [ "${BUMP_RESULT}" = "failure" ]; then
            details+=("The bump job failed.")
          fi
          if [ "${CHECK_PIN_RESULT}" = "failure" ]; then
            details+=("Required testx version doesn't match testx/.")
          fi
          text=$(printf '%s\n' \
            ":warning: *go.temporal.io/testx version on main needs attention*" \
            "${details[@]}" \
            "<${RUN_URL}|View run> · <${BUMP_PRS_URL}|Bump PR>")
          jq -n --arg text "${text}" '{text: $text}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- "${SLACK_WEBHOOK}"
