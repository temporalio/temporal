name: Optimize Test Sharding

on:
  schedule:
    # Mondays at 0700 UTC, covering the week that just ended. Running daily would mostly sample
    # the same runs again and rewrite the salt based on noise rather than meaningful test changes.
    - cron: "0 7 * * 1"
  workflow_dispatch: # Allow manual trigger

permissions:
  actions: read
  contents: read
  pull-requests: write

env:
  SALT_FILE: tests/testcore/shard_salt.txt
  BRANCH: auto/optimize-test-sharding

jobs:
  update-salts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.TEMPORAL_CICD_APP_ID }}
          private-key: ${{ secrets.TEMPORAL_CICD_PRIVATE_KEY }}
          owner: temporalio

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Read functional test shard count
        id: shard-count
        run: |
          set -euo pipefail

          count=$(sed -n 's/^[[:space:]]*SHARD_COUNT:[[:space:]]*\([0-9][0-9]*\).*/\1/p' .github/workflows/run-tests.yml | sort -u)
          if [[ $(wc -l <<<"$count") -ne 1 || -z $count ]]; then
            echo "Expected exactly one SHARD_COUNT value in run-tests.yml, found: ${count:-none}" >&2
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Optimize functional test sharding
        run: |
          # NOTE: shard count must match shards in run-tests.yml, so it is read from that file.
          go run ./cmd/tools/optimize-test-sharding \
            -shards "${{ steps.shard-count.outputs.count }}" \
            -workflow run-tests.yml \
            -artifact-pattern 'junit-xml--*shard*--functional-test' \
            -days 7 \
            -runs 200 \
            -file "${{ env.SALT_FILE }}" \
            -threshold 0.05
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Create pull request
        id: create-pr
        run: |
          if git diff --quiet -- "${{ env.SALT_FILE }}"; then
            echo "No changes to shard salt"
            exit 0
          fi

          # Delete remote branch if it exists from a previous run.
          # This will also close a previous, stuck PR if it exists.
          git push origin --delete ${{ env.BRANCH }} 2>/dev/null || true

          git config --local user.name 'Temporal Data'
          git config --local user.email 'commander-data@temporal.io'

          git checkout -b ${{ env.BRANCH }}
          git add "${{ env.SALT_FILE }}"
          git commit -m "Update test shard salt"
          git push origin ${{ env.BRANCH }}

          pr_url=$(gh pr create \
            --title "Update test shard salt" \
            --body "Automatically generated by the optimize-test-sharding workflow.")

          echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Approve pull request
        if: steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
        run: gh pr review --approve "${PR_URL}"

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
        run: gh pr merge "${PR_URL}" --auto --squash

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            {"text": "Test sharding salt optimization failed. Shard assignment is unchanged, but the salt will not track current test durations until the workflow is fixed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
