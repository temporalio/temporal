name: testx

on:
  pull_request:
    paths:
      - "testx/**"
      - "go.mod"
      - ".github/workflows/testx*.yml"

permissions:
  contents: read

jobs:
  testx:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            testx/go.sum

      - name: Check testx does not depend on the server
        run: |
          if go -C testx list -m all | grep -q '^go.temporal.io/server[ /]'; then
            echo "::error file=testx/go.mod::testx must not depend on go.temporal.io/server"
            exit 1
          fi

      - name: Check testx go.mod is tidy
        run: go -C testx mod tidy -diff

      # Downstream consumers of the server resolve the testx version required in the root
      # go.mod, which testx-tag.yml tags on the merge commit. Every testx change therefore
      # needs a new version, or consumers would get a tag that doesn't contain the change.
      - name: Check testx version was bumped
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- testx/; then
            echo "No testx changes."
            exit 0
          fi
          version=$(go list -m -f '{{.Version}}' github.com/temporalio/temporal/testx)
          if git ls-remote --exit-code --tags origin "refs/tags/testx/$version" >/dev/null; then
            echo "::error file=go.mod::testx/$version already exists; bump the github.com/temporalio/temporal/testx version in go.mod"
            exit 1
          fi
          echo "testx changes will be released as testx/$version."

      - name: Test testx
        run: make testx-test

      - name: Lint testx
        env:
          GOLANGCI_LINT_BASE_REV: ${{ github.event.pull_request.base.sha }}
        run: make lint-testx
