name: testx

on:
  pull_request:
    paths:
      - "testx/**"
      - ".github/workflows/testx*.yml"

permissions:
  contents: read

jobs:
  testx:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: testx
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            testx/go.sum

      - name: Check testx does not depend on other go.temporal.io modules
        run: |
          mods=$(go list -m -f '{{if not .Main}}{{.Path}}{{end}}' all)
          deps=$(echo "$mods" | grep '^go.temporal.io/' || true)
          if [ -n "$deps" ]; then
            echo "::error file=testx/go.mod::testx must not depend on go.temporal.io modules: $(echo "$deps" | tr "\n" " ")"
            exit 1
          fi

      - name: Check testx go.mod is tidy
        run: go mod tidy -diff

      - name: Test testx
        run: make test

      - name: Lint testx
        env:
          GOLANGCI_LINT_BASE_REV: ${{ github.event.pull_request.base.sha }}
        run: make lint
