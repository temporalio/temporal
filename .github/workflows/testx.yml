name: testx

on:
  pull_request:
    paths:
      - "common/testx/**"
      - ".github/workflows/testx*.yml"

permissions:
  contents: read

jobs:
  testx:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: common/testx
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            common/testx/go.sum

      - name: Check testx does not depend on other go.temporal.io modules
        run: |
          mods=$(go list -m -f '{{if not .Main}}{{.Path}}{{end}}' all)
          deps=$(echo "$mods" | grep '^go.temporal.io/' || true)
          if [ -n "$deps" ]; then
            echo "::error file=common/testx/go.mod::testx must not depend on go.temporal.io modules: $(echo "$deps" | tr "\n" " ")"
            exit 1
          fi

      - name: Check failpoint has no build tags
        run: |
          # The failpoint packages must behave the same in every build; consumers enable them.
          files=$(grep -rlE --include='*.go' '^[[:space:]]*//[[:space:]]*(go:build|\+build)' failpoint) || [ $? -eq 1 ]
          if [ -n "$files" ]; then
            echo "::error::failpoint must not use build tags: $(echo "$files" | tr "\n" " ")"
            exit 1
          fi

      - name: Check failpoint has no Temporal server concepts
        run: |
          # failpoint is a general-purpose library. Drop the module path and the proto package,
          # which contain "temporal", then look for server concepts.
          scan=$(grep -rnI . failpoint proto)
          scan=$(printf '%s\n' "$scan" | sed -E 's#go\.temporal\.io/testx##g; s#temporal[._/]testx[._/]failpoint[._/]v1##g')
          # grep exits with 1 when nothing matches; any other failure fails the step.
          matches=$(printf '%s\n' "$scan" | grep -iE 'temporal|namespace|history|matching') || [ $? -eq 1 ]
          if [ -n "$matches" ]; then
            echo "::error::failpoint must not mention Temporal server concepts:"
            echo "$matches"
            exit 1
          fi

      - name: Check testx go.mod is tidy
        run: go mod tidy -diff

      - name: Check testx generated protos are up to date
        run: |
          make proto
          git diff --exit-code -- . || { echo "::error::run 'make proto' in common/testx and commit the result"; exit 1; }

      - name: Test testx
        run: make test

      - name: Lint testx
        env:
          GOLANGCI_LINT_BASE_REV: ${{ github.event.pull_request.base.sha }}
        run: make lint
