# Keep cloud release branches satisfying the release invariant: the
# go.temporal.io/api version a cloud release uses has to correspond to a tagged
# api-go release. Creating that release is otherwise a manual, multi-step
# process someone has to notice is needed, so when a branch pins an untagged
# commit, trigger it here instead.
#
# This runs unattended, and a silent failure means the invariant is quietly
# violated, so anything that goes wrong is reported to Slack.
name: Trigger api-go release for cloud branch

on:
  push:
    branches:
      - "cloud/**"

permissions:
  contents: read

# Serialize per branch. Two branches pinning the same untagged commit can still
# race, which the wait step below tolerates.
concurrency:
  group: trigger-api-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger-api-release:
    name: Trigger api-go release
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Decide whether an api-go release is needed
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          go run ./cmd/tools/check-dependencies
          --mode plan-api-release
          --base-branch "$GITHUB_REF_NAME"

      # Recorded for every run, no-ops included, so "why did nothing happen"
      # stays answerable after the fact.
      - name: Summarize decision
        if: always() && steps.plan.outputs.action != ''
        env:
          ACTION: ${{ steps.plan.outputs.action }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          printf '**%s**: %s\n' "$ACTION" "$REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate token
        id: token
        if: steps.plan.outputs.action == 'release'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.TEMPORAL_CICD_APP_ID }}
          private-key: ${{ secrets.TEMPORAL_CICD_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            api

      - name: Dispatch api-go release
        if: steps.plan.outputs.action == 'release'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          BASE_TAG: ${{ steps.plan.outputs.base_tag }}
          API_GO_SHA: ${{ steps.plan.outputs.api_go_sha }}
          API_REF: ${{ steps.plan.outputs.api_ref }}
          DISPATCH_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh workflow run create-release.yml -R https://github.com/temporalio/api \
            -r main \
            -f api_ref="$API_REF" \
            -f api_go_ref="$API_GO_SHA" \
            -f tag="$TAG" \
            -f base_tag="$BASE_TAG" \
            -f auto_publish=true \
            -f dispatch_id="$DISPATCH_ID"

      # The dispatch only starts the chain; the tag appearing is what proves it
      # finished. Any tag counts, whoever created it, so that two branches
      # pinning the same commit do not alert each other. The release chain has
      # taken up to 46 minutes.
      - name: Wait for the api-go tag
        if: steps.plan.outputs.action == 'release'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          TIMEOUT_SECONDS: "3600"
          INTERVAL_SECONDS: "30"
        run: |
          repo=https://github.com/temporalio/api-go.git
          deadline=$((SECONDS + TIMEOUT_SECONDS))
          while [[ "$SECONDS" -lt "$deadline" ]]; do
            if [[ -n "$(git ls-remote --tags "$repo" "refs/tags/$TAG")" ]]; then
              echo "Tag $TAG now exists in api-go"
              exit 0
            fi
            sleep "$INTERVAL_SECONDS"
          done
          echo "::error::Tag $TAG did not appear in api-go within $TIMEOUT_SECONDS seconds"
          exit 1

      - name: Notify Slack
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_RELENG_WEBHOOK }}
          webhook-type: incoming-webhook
          # The action returns success on a Slack-side error unless asked not to.
          errors: true
          payload: |
            {"text": ${{ toJSON(format('api-go release automation failed on `{0}` — go.temporal.io/api {1} — {2} — {3}/{4}/actions/runs/{5}', github.ref_name, steps.plan.outputs.version, steps.plan.outputs.reason, github.server_url, github.repository, github.run_id)) }}}
