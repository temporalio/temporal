name: testx-tag

on:
  push:
    branches:
      - main
    paths:
      - "testx/**"
      - "go.mod"

permissions:
  contents: write

concurrency:
  group: testx-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag testx version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: false

      # The root go.mod requires the testx version that this commit introduces. Tagging the
      # commit makes that version resolvable for downstream consumers of the server.
      - name: Tag commit with the required testx version
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/temporalio/temporal/testx)
          tag="testx/$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            # Two PRs bumping to the same version don't conflict in go.mod, so check that the
            # existing tag really contains this commit's testx code.
            if ! git diff --quiet "$tag" "$GITHUB_SHA" -- testx/; then
              echo "::error::$tag already exists but doesn't match testx/ at $GITHUB_SHA; bump the testx version in go.mod"
              exit 1
            fi
            echo "$tag already exists."
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "Tagged $GITHUB_SHA as $tag."
