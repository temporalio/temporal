# Reviews PRs from opted-in team members or Claude review labels with Claude.
#
# Uses `pull_request_target` so the workflow has access to secrets even when
# a PR is opened from a fork. This is safe ONLY because the
# `check-review-eligibility` job gates the review job behind trusted user
# checks.
name: Claude review for opted-in PRs

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled]

env:
  # Space- or newline-separated list of temporalio team slugs whose
  # members' PRs should receive an automated Claude review. Empty means only
  # PRs labeled with REVIEW_OPT_IN_LABEL by a temporalio org member are reviewed.
  REVIEW_TEAMS: "nexus act oss-matching"
  REVIEW_OPT_IN_LABEL: request-claude-review
  REVIEW_OPT_OUT_LABEL: skip-claude-review

jobs:
  check-review-eligibility:
    if: >-
      (
        github.event.action != 'labeled' &&
        github.event.pull_request.draft == false
      ) ||
      (
        github.event.action == 'labeled' &&
        (
          github.event.label.name == 'request-claude-review' ||
          github.event.label.name == 'skip-claude-review'
        )
      )
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    permissions: {} # uses the Temporal CI/CD Bot app token, not GITHUB_TOKEN
    outputs:
      should_review: ${{ steps.decision.outputs.should_review }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Generate app token
        id: generate_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.TEMPORAL_AI_REVIEW_APP_ID }}
          private-key: ${{ secrets.TEMPORAL_AI_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Least-privilege: members:read for team-membership lookups,
          # pull-requests:read for PR metadata, and
          # issues:read for PR label lookups.
          permission-members: read
          permission-pull-requests: read
          permission-issues: read
      - id: resolve
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          author="$PR_AUTHOR"
          head_sha="$PR_HEAD_SHA"
          pr_number="$EVENT_PR_NUMBER"

          echo "Resolved PR #${pr_number}: author=${author}, head_sha=${head_sha}"
          {
            echo "pr_number=${pr_number}"
            echo "author=${author}"
            echo "head_sha=${head_sha}"
          } >> "$GITHUB_OUTPUT"
      - id: decision
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          AUTHOR: ${{ steps.resolve.outputs.author }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL_NAME: ${{ github.event.label.name }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          set_review_decision() {
            echo "should_review=$1" >> "$GITHUB_OUTPUT"
          }

          skip_review() {
            echo "Skipping Claude review for PR #${PR_NUMBER}: $1"
            set_review_decision false
            exit 0
          }

          enable_review() {
            echo "Claude review enabled for PR #${PR_NUMBER}: $1"
            set_review_decision true
            exit 0
          }

          labels_match() {
            [ "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$2" | tr '[:upper:]' '[:lower:]')" ]
          }

          has_label() {
            printf '%s\n' "$labels" | awk -v label="$1" 'tolower($0) == tolower(label) { found = 1 } END { exit !found }'
          }

          require_org_member() {
            user="$1"
            role="$2"

            echo "Checking temporalio organization membership for ${role} ${user}"
            if response=$(gh api \
                -H "Accept: application/vnd.github+json" \
                "/orgs/temporalio/memberships/${user}" 2>&1); then
              if [ "$(echo "$response" | jq -r '.state')" != "active" ]; then
                skip_review "${role} is not an active temporalio organization member"
              fi
            elif echo "$response" | grep -q "HTTP 404"; then
              skip_review "${role} is not a temporalio organization member"
            else
              echo "Unexpected error checking temporalio organization membership for ${role} ${user}: ${response}" >&2
              exit 1
            fi
            echo "${role} ${user} is an active temporalio organization member"
          }

          require_repo_write() {
            user="$1"
            role="$2"

            echo "Checking repository write permission for ${role} ${user}"
            if response=$(gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${REPO}/collaborators/${user}/permission" 2>&1); then
              permission=$(echo "$response" | jq -r '.permission')
              case "$permission" in
                admin|write)
                  echo "${role} ${user} has repository ${permission} permission"
                  ;;
                *)
                  skip_review "${role} has repository ${permission} permission, not write/admin"
                  ;;
              esac
            elif echo "$response" | grep -q "HTTP 404"; then
              skip_review "${role} is not a repository collaborator"
            else
              echo "Unexpected error checking repository permission for ${role} ${user}: ${response}" >&2
              exit 1
            fi
          }

          if [ "$EVENT_ACTION" = "labeled" ]; then
            require_org_member "$EVENT_ACTOR" "labeler"
            require_repo_write "$EVENT_ACTOR" "labeler"
          else
            require_org_member "$AUTHOR" "author"
            require_repo_write "$AUTHOR" "author"
          fi

          echo "Fetching labels for PR #${PR_NUMBER}"
          labels=$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/issues/${PR_NUMBER}" --jq '.labels[].name')
          if [ -z "$labels" ]; then
            echo "PR #${PR_NUMBER} has no labels"
          else
            echo "PR #${PR_NUMBER} labels:"
            printf '%s\n' "$labels" | sed 's/^/- /'
          fi

          if has_label "$REVIEW_OPT_OUT_LABEL"; then
            skip_review "skip label '${REVIEW_OPT_OUT_LABEL}' is present"
          fi
          echo "No skip label '${REVIEW_OPT_OUT_LABEL}' found on PR #${PR_NUMBER}"
          if [ "$EVENT_ACTION" = "labeled" ]; then
            if ! labels_match "$EVENT_LABEL_NAME" "$REVIEW_OPT_IN_LABEL"; then
              skip_review "label '${EVENT_LABEL_NAME}' does not request Claude review"
            fi
          fi

          echo "Checking PR #${PR_NUMBER} for request label '${REVIEW_OPT_IN_LABEL}'"
          if has_label "$REVIEW_OPT_IN_LABEL"; then
            enable_review "request label '${REVIEW_OPT_IN_LABEL}' is present"
          fi
          echo "No request label '${REVIEW_OPT_IN_LABEL}' found on PR #${PR_NUMBER}"
          if [ -z "$REVIEW_TEAMS" ]; then
            skip_review "no REVIEW_TEAMS configured; PR requires request label '${REVIEW_OPT_IN_LABEL}'"
          fi

          echo "Checking configured review teams for ${AUTHOR}"
          is_member=false
          matched_team=""
          for team in $REVIEW_TEAMS; do
            if response=$(gh api \
                -H "Accept: application/vnd.github+json" \
                "/orgs/temporalio/teams/${team}/memberships/${AUTHOR}" 2>&1); then
              if [ "$(echo "$response" | jq -r '.state')" = "active" ]; then
                echo "${AUTHOR} is an active member of temporalio/${team}"
                is_member=true
                matched_team="$team"
                break
              fi
            elif echo "$response" | grep -q "HTTP 404"; then
              : # author is not a member of this team; try the next one
            else
              echo "Unexpected error checking temporalio/${team} membership: ${response}" >&2
              exit 1
            fi
          done

          if [ "$is_member" = "false" ]; then
            skip_review "author is not in a configured review team"
          fi

          enable_review "author is in configured review team 'temporalio/${matched_team}'"

  review:
    needs: check-review-eligibility
    if: needs.check-review-eligibility.outputs.should_review == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.check-review-eligibility.outputs.head_sha }}
          path: pr-head
      - name: Claude PR review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Always on, so label- and auto-triggered reviews produce the same output.
          track_progress: true
          include_fix_links: false
          prompt: |
            ## Review task

            Use `.claude/skills/review/SKILL.md` and apply it as the review skill.
            Please review PR #${{ needs.check-review-eligibility.outputs.pr_number }}.
            The trusted base branch is checked out in the current working directory.
            The PR head is checked out in `pr-head/`.
            Review the changes in `pr-head/`.
            Use `gh pr view ${{ needs.check-review-eligibility.outputs.pr_number }} --json title,body,commits` to read the PR description and commit messages.
            Use `gh pr diff ${{ needs.check-review-eligibility.outputs.pr_number }}` to inspect the diff; `git diff` does not work across the two checkouts.

            ## Posting rules

            Prefer inline comments for all actionable findings.
            Use `mcp__github_inline_comment__create_inline_comment` with `confirmed: true` to highlight specific code issues.
            When posting inline comments, use repository-relative PR file paths from the diff, without the `pr-head/` prefix.

            The top-level comment tracks status; the review itself is the inline comments.
            Reviewing is a single task, so track it as one: while working, that comment reads
            `Reviewing...`; once finished, it reads `Reviewed N files, M findings.`
            That line is your closing summary. The findings are already inline, so restating
            them there, or your process, or what you could not run, adds nothing to it.
            Findings with no changed line to attach to may follow that line, formatted like
            inline findings.
            Only post GitHub comments - don't submit review text as messages.

            ## Findings log

            After posting, return every finding you posted as structured output, one entry per
            finding, inline or not. This structured output is a machine-readable log, not a review
            message, so the posting rules above do not apply to it. Use the same severity, the repository-relative path, and the
            line you commented on; omit `path` and `line` for findings not tied to a file.
            Set `category` to exactly one of the following. Use a bug category only if the code
            in the PR behaves incorrectly; otherwise use a non-bug category.
            Bugs:
            - `logic`: wrong result, wrong condition, off-by-one.
            - `crash`: nil dereference, panic, out-of-bounds access.
            - `concurrency`: race, deadlock, I/O inside a critical section.
            - `data-loss`: lost or corrupted state, wrong persistence or transaction boundary.
            - `liveness`: an execution or task that stops making progress or is never retried.
            - `error-handling`: swallowed or misclassified error, wrong retryable or gRPC status.
            - `compatibility`: replay or determinism break, backwards-incompatible proto, API,
              history, or persistence change, unsafe rollout.
            - `resource`: leak, unbounded growth, missing limit.
            - `security`: authorization bypass, injection, secret exposure.
            - `behavior`: unintended change to a guarantee the server provides.
            Not bugs:
            - `testing`: missing, wrong, or unreliable tests.
            - `design`: structure, abstractions, API shape.
            - `style`: conventions, naming, comments.
            - `description`: missing or unclear PR description or intent.
            Return an empty `findings` list if you posted none.
          claude_args: |
            --add-dir pr-head --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{
              "type": "object",
              "required": ["findings"],
              "additionalProperties": false,
              "properties": {
                "findings": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "required": ["severity", "category", "summary", "details"],
                    "additionalProperties": false,
                    "properties": {
                      "severity": {"type": "string", "enum": ["nit", "small", "med", "high"]},
                      "category": {
                        "type": "string",
                        "enum": [
                          "logic", "crash", "concurrency", "data-loss", "liveness",
                          "error-handling", "compatibility", "resource", "security", "behavior",
                          "testing", "design", "style", "description"
                        ]
                      },
                      "path": {"type": "string"},
                      "line": {"type": "integer"},
                      "summary": {"type": "string"},
                      "details": {"type": "string"}
                    }
                  }
                }
              }
            }'
      - name: Save review findings
        if: ${{ !cancelled() && steps.claude.outputs.structured_output != '' }}
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.check-review-eligibility.outputs.pr_number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ needs.check-review-eligibility.outputs.head_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail

          # Workflow context comes from the event, not from Claude, so each finding
          # can be traced back to the exact commit that was reviewed.
          # `is_bug` is derived from the category so the two can't disagree.
          jq -n \
            --argjson output "$STRUCTURED_OUTPUT" \
            --arg repo "$REPO" \
            --argjson pr_number "$PR_NUMBER" \
            --arg base_sha "$BASE_SHA" \
            --arg head_sha "$HEAD_SHA" \
            --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg workflow_sha "$WORKFLOW_SHA" \
            --arg reviewed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: 1,
              repo: $repo,
              pr_number: $pr_number,
              base_sha: $base_sha,
              head_sha: $head_sha,
              run_id: $run_id,
              run_attempt: $run_attempt,
              workflow_sha: $workflow_sha,
              reviewed_at: $reviewed_at,
              findings: [
                $output.findings[]
                | .is_bug = (.category | IN("testing", "design", "style", "description") | not)
              ]
            }' > "$RUNNER_TEMP/claude-review-findings.json"

          echo "Logged $(jq '.findings | length' "$RUNNER_TEMP/claude-review-findings.json") finding(s), $(jq '[.findings[] | select(.is_bug)] | length' "$RUNNER_TEMP/claude-review-findings.json") bug(s), for PR #${PR_NUMBER} at ${HEAD_SHA}"
      - name: Upload review findings
        if: ${{ !cancelled() && steps.claude.outputs.structured_output != '' }}
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: claude-review-findings-pr${{ needs.check-review-eligibility.outputs.pr_number }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-review-findings.json
          if-no-files-found: ignore
          retention-days: 90
