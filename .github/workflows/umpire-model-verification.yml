name: Umpire Model Verification
on:
  pull_request:
    paths:
      - ".github/workflows/umpire-model-verification.yml"
      - "cmd/umpire-genmodels/**"
      - "common/testing/umpire/**"
      - "tests/umpire2/**"
      - "Makefile"
  schedule:
    - cron: "31 8 * * *"
permissions:
  contents: read
concurrency:
  group: umpire-model-verification-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - name: Install pinned verification tools
        run: |
          source tests/umpire2/testdata/genmodels/tools.env
          sudo apt-get update
          sudo apt-get install --yes graphviz maven python3-tk

          tools="$RUNNER_TEMP/umpire-tools"
          mkdir -p "$tools/downloads" \
            "$tools/$UMPIRE_TOOL_APALACHE_EXTRACT_ROOT" \
            "$tools/$UMPIRE_TOOL_FIZZBEE_EXTRACT_ROOT" \
            "$tools/$UMPIRE_TOOL_IVY_EXTRACT_ROOT" \
            "$tools/$UMPIRE_TOOL_P_EXTRACT_ROOT" \
            "$tools/$UMPIRE_TOOL_TLA2TOOLS_EXTRACT_ROOT"

          tla_archive="$tools/downloads/$UMPIRE_TOOL_TLA2TOOLS_ARCHIVE"
          curl --fail --location --silent --show-error \
            "$UMPIRE_TOOL_TLA2TOOLS_URL" \
            --output "$tla_archive"
          echo "$UMPIRE_TOOL_TLA2TOOLS_SHA256  $tla_archive" | sha256sum --check
          test "$UMPIRE_TOOL_TLA2TOOLS_ARCHIVE_TYPE" = file
          cp "$tla_archive" "$tools/$UMPIRE_TOOL_TLA2TOOLS_EXECUTABLE"

          apalache_archive="$tools/downloads/$UMPIRE_TOOL_APALACHE_ARCHIVE"
          curl --fail --location --silent --show-error \
            "$UMPIRE_TOOL_APALACHE_URL" \
            --output "$apalache_archive"
          echo "$UMPIRE_TOOL_APALACHE_SHA256  $apalache_archive" | sha256sum --check
          test "$UMPIRE_TOOL_APALACHE_ARCHIVE_TYPE" = zip
          unzip -q "$apalache_archive" -d "$tools/$UMPIRE_TOOL_APALACHE_EXTRACT_ROOT"

          p_package="$tools/downloads/$UMPIRE_TOOL_P_ARCHIVE"
          curl --fail --location --silent --show-error \
            "$UMPIRE_TOOL_P_URL" \
            --output "$p_package"
          echo "$UMPIRE_TOOL_P_SHA256  $p_package" | sha256sum --check
          test "$UMPIRE_TOOL_P_ARCHIVE_TYPE" = nuget
          dotnet tool install "$UMPIRE_TOOL_P_PACKAGE" --version "$UMPIRE_TOOL_P_VERSION" --tool-path "$tools/$UMPIRE_TOOL_P_EXTRACT_ROOT" \
            --add-source "$tools/downloads" --ignore-failed-sources

          ivy_wheel="$tools/downloads/$UMPIRE_TOOL_IVY_ARCHIVE"
          curl --fail --location --silent --show-error \
            "$UMPIRE_TOOL_IVY_URL" \
            --output "$ivy_wheel"
          echo "$UMPIRE_TOOL_IVY_SHA256  $ivy_wheel" | sha256sum --check
          test "$UMPIRE_TOOL_IVY_ARCHIVE_TYPE" = wheel
          python -m venv "$tools/$UMPIRE_TOOL_IVY_EXTRACT_ROOT"
          "$tools/$UMPIRE_TOOL_IVY_EXTRACT_ROOT/bin/pip" install "$ivy_wheel"

          fizz_archive="$tools/downloads/$UMPIRE_TOOL_FIZZBEE_ARCHIVE"
          curl --fail --location --silent --show-error \
            "$UMPIRE_TOOL_FIZZBEE_URL" \
            --output "$fizz_archive"
          echo "$UMPIRE_TOOL_FIZZBEE_SHA256  $fizz_archive" | sha256sum --check
          test "$UMPIRE_TOOL_FIZZBEE_ARCHIVE_TYPE" = tar.gz
          tar -xzf "$fizz_archive" --strip-components=1 -C "$tools/$UMPIRE_TOOL_FIZZBEE_EXTRACT_ROOT"

          echo "UMPIRE_APALACHE_TOOL=$tools/$UMPIRE_TOOL_APALACHE_EXECUTABLE" >> "$GITHUB_ENV"
          echo "UMPIRE_IVY_TOOL=$tools/$UMPIRE_TOOL_IVY_EXECUTABLE" >> "$GITHUB_ENV"
          echo "UMPIRE_FIZZ_TOOL=$tools/$UMPIRE_TOOL_FIZZBEE_EXECUTABLE" >> "$GITHUB_ENV"
          echo "UMPIRE_JAVA_TOOL=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
          echo "UMPIRE_P_TOOL=$tools/$UMPIRE_TOOL_P_EXECUTABLE" >> "$GITHUB_ENV"
          echo "UMPIRE_TLA_JAR=$tools/$UMPIRE_TOOL_TLA2TOOLS_EXECUTABLE" >> "$GITHUB_ENV"
      - name: Check generated models
        run: make umpire-check-genmodels
      - name: Test generators and seeded counterexamples
        run: |
          go test -tags test_dep \
            ./common/testing/umpire/verify/... \
            ./tests/umpire2/internal/protocol \
            ./tests/umpire2/internal/rule \
            ./cmd/umpire-genmodels
      - name: Verify generated protocol
        env:
          PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || 'smoke' }}
        run: make "umpire-verify-$PROFILE"
      - name: Verify generated FizzBee target
        if: github.event_name != 'schedule'
        run: >-
          go run -tags test_dep ./cmd/umpire-genmodels -mode verify -target feature-nexus -backend fizz -profile smoke
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: umpire-model-verification-${{ github.run_id }}
          path: tests/umpire2/testdata/results/
          if-no-files-found: ignore
